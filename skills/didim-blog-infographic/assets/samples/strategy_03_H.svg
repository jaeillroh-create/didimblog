<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="&#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" style="white-space:pre" role="img" aria-label="직무발명 보상 이후 IP 예산 항목별 비용 막대 그래프"><title>직무발명 보상 이후 IP 예산 항목별 비용 막대 그래프</title><rect x="0.0" y="0.0" width="1080.0" height="1350.0" rx="0" fill="#FFFFFF"/><rect x="80.0" y="80.0" width="64.0" height="10.0" rx="5" fill="#1B3A5C"/><text x="80.0" y="169.4" font-size="58" font-weight="800" fill="#191F28" text-anchor="start" xml:space="preserve">IP 예산, 해외 출원 비중 큰 사례</text><line x1="80.0" y1="1219.5" x2="1000.0" y2="1219.5" stroke="#8B95A1" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/><text x="80.0" y="1276.2" font-size="30" font-weight="400" fill="#191F28" fill-opacity="0.72" text-anchor="start" xml:space="preserve">스타트업 연간 IP 예산 사례 · 단위: 원 · 개별 상황에 따라 다름</text><text x="80.0" y="373.9" font-size="40" font-weight="700" fill="#1B3A5C" text-anchor="start" xml:space="preserve">PCT 출원</text><rect x="80.0" y="396.9" width="673.7" height="56.0" rx="10" fill="#1B3A5C" fill-opacity="1"/><text x="771.7" y="439.6" font-size="42" font-weight="800" fill="#1B3A5C" text-anchor="start" xml:space="preserve">2,400만 원</text><text x="80.0" y="583.9" font-size="40" font-weight="700" fill="#191F28" text-anchor="start" xml:space="preserve">국내 특허 출원</text><rect x="80.0" y="606.9" width="336.9" height="56.0" rx="10" fill="#8B95A1" fill-opacity="0.45"/><text x="434.9" y="649.6" font-size="42" font-weight="800" fill="#191F28" text-anchor="start" xml:space="preserve">1,200만 원</text><text x="80.0" y="793.9" font-size="40" font-weight="700" fill="#191F28" text-anchor="start" xml:space="preserve">상표 출원</text><rect x="80.0" y="816.9" width="84.2" height="56.0" rx="10" fill="#8B95A1" fill-opacity="0.45"/><text x="182.2" y="859.6" font-size="42" font-weight="800" fill="#191F28" text-anchor="start" xml:space="preserve">300만 원</text><text x="80.0"