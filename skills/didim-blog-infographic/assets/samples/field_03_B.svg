<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="&#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" style="white-space:pre" role="img" aria-label="직무발명보상금 도입 4단계 절차 인포그래픽"><title>직무발명보상금 도입 4단계 절차 인포그래픽</title><rect x="0.0" y="0.0" width="1080.0" height="1350.0" rx="0" fill="#FFFFFF"/><rect x="80.0" y="80.0" width="64.0" height="10.0" rx="5" fill="#D4740A"/><text x="80.0" y="175.4" font-size="64" font-weight="800" fill="#191F28" text-anchor="start" xml:space="preserve">규정부터 지급까지 4단계</text><line x1="80.0" y1="1219.5" x2="1000.0" y2="1219.5" stroke="#8B95A1" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/><text x="80.0" y="1276.2" font-size="30" font-weight="400" fill="#191F28" fill-opacity="0.72" text-anchor="start" xml:space="preserve">직무발명 보상 제도 도입 절차 · 기업별 세부 절차는 다를 수 있음</text><rect x="80.0" y="297.9" width="920.0" height="159.4" rx="24" fill="#D4740A" fill-opacity="0.1" stroke="#D4740A" stroke-width="3"/><circle cx="146.0" cy="377.6" r="20" fill="#D4740A"/><text x="198.0" y="367.6" font-size="46" font-weight="800" fill="#D4740A" text-anchor="start" xml:space="preserve">보상 규정 제정</text><text x="198.0" y="421.1" font-size="34" font-weight="400" fill="#191F28" fill-opacity="0.75" text-anchor="start" xml:space="preserve">사내 직무발명 보상 규정을 만듭니다</text><path d="M520.0,478.3 L560.0,478.3 L540.0,501.3 Z" fill="#8B95A1"/><rect x="80.0" y="521.3" width="920.0" height="159.4" rx="24" fill="#8B95A1" fill-opacity="0.09"/><circle cx="146.0" cy="601.0" r="20" fill="#8B95A1"/><text x="198.0" y="591.0" font-size="46" font-weight="800" fill="#191F28" text-anchor="start" xml:space="preserve">발명 신고 접수</text><text x="198.0" y="644.5" font-size="34" font-weight="400" fill="#191F28" fill-opacity="0.75" text-anchor="start" xml:space="preserve">직원이 발명 신고서를 냅니다</text><path d="M520.0,701.7 L560.0,701.7 L540.0,724.7 Z" fill="#8B95A1"/><rect x="80.0" y="744.7" width="920.0" height="