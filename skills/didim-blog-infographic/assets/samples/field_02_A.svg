<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="&#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" style="white-space:pre" role="img" aria-label="직무발명보상금 적용 전후 법인세 비교 인포그래픽"><title>직무발명보상금 적용 전후 법인세 비교 인포그래픽</title><rect x="0.0" y="0.0" width="1080.0" height="1350.0" rx="0" fill="#FFFFFF"/><rect x="80.0" y="80.0" width="64.0" height="10.0" rx="5" fill="#D4740A"/><text x="80.0" y="169.4" font-size="58" font-weight="800" fill="#191F28" text-anchor="start" xml:space="preserve">같은 이익, 법인세가 달라진 사례</text><line x1="80.0" y1="1179.0" x2="1000.0" y2="1179.0" stroke="#8B95A1" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/><text x="80.0" y="1235.8" font-size="30" font-weight="400" fill="#191F28" fill-opacity="0.72" text-anchor="start" xml:space="preserve">매출 80억 원 제조업 사례 · 조세특례제한법</text><text x="80.0" y="1276.2" font-size="30" font-weight="400" fill="#191F28" fill-opacity="0.72" text-anchor="start" xml:space="preserve">관련 규정 기준 · 개별 상황에 따라 다름</text><rect x="80.0" y="242.2" width="920.0" height="371.4" rx="28" fill="#8B95A1" fill-opacity="0.1"/><text x="136.0" y="355.7" font-size="38" font-weight="700" fill="#191F28" fill-opacity="0.75" text-anchor="start" xml:space="preserve">적용 전</text><text x="136.0" y="464.0" font-size="84" font-weight="800" fill="#191F28" text-anchor="start" xml:space="preserve">법인세 2억 원</text><rect x="80.0" y="763.6" width="920.0" height="371.4" rx="28" fill="#D4740A" fill-opacity="0.08"/><text x="136.0" y="879.4" font-size="38" font-weight="700" fill="#191F28" fill-opacity="0.75" text-anchor="start" xml:space="preserve">적용 후</text><text x="136.0" y="984.0" font-size="80" font-weight="800" fill="#D4740A" text-anchor="start" xml:space="preserve"><tspan fill="#D4740A">법인세 약 5,000만 원</tspan></text><rect x="136.0" y="506.2" width="808.0" height="26.0" rx="13" fill="#8B95A1" fill-opacity="0.22"/><rect x="136.0" y="506.2" width="808.0" height="2