<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="&#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" style="white-space:pre" role="img" aria-label="IP 바우처 지원 한도와 일정 숫자 카드"><title>IP 바우처 지원 한도와 일정 숫자 카드</title><rect x="0.0" y="0.0" width="1080.0" height="1350.0" rx="0" fill="#FFFFFF"/><rect x="80.0" y="80.0" width="64.0" height="10.0" rx="5" fill="#3A3A3A"/><text x="80.0" y="175.4" font-size="64" font-weight="800" fill="#191F28" text-anchor="start" xml:space="preserve">올해 IP 바우처 한눈에 보기</text><line x1="80.0" y1="1219.5" x2="1000.0" y2="1219.5" stroke="#8B95A1" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/><text x="80.0" y="1276.2" font-size="30" font-weight="400" fill="#191F28" fill-opacity="0.72" text-anchor="start" xml:space="preserve">예시 공고 기준 · 세부 요건은 공고문 확인</text><rect x="80.0" y="398.7" width="446.0" height="300.0" rx="24" fill="#3A3A3A" fill-opacity="1"/><text x="303.0" y="533.8" font-size="48" font-weight="900" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">최대 5,000만 원</text><text x="303.0" y="596.6" font-size="38" font-weight="500" fill="#FFFFFF" fill-opacity="0.9" text-anchor="middle" xml:space="preserve">지원 한도</text><rect x="554.0" y="398.7" width="446.0" height="300.0" rx="24" fill="#8B95A1" fill-opacity="0.08"/><text x="777.0" y="542.2" font-size="72" font-weight="900" fill="#191F28" text-anchor="middle" xml:space="preserve">30%</text><text x="777.0" y="610.4" font-size="38" font-weight="500" fill="#191F28" fill-opacity="0.75" text-anchor="middle" xml:space="preserve">자부담 비율</text><rect x="80.0" y="726.7" width="446.0" height="300.0" rx="24" fill="#8B95A1" fill-opacity="0.08"/><text x="303.0" y="870.2" font-size="72" font-weight="900" fill="#191F28" text-anchor="middle" xml:space="preserve">4주</text><text x="303.0" y="938.4" font-size="38" font-weight="500" fill="#191F28" fill-opacity="0.75" text-anchor="middle" xml:space="preserve">신청 기간</text><rect x="554.0" y="726.7" width="446.0" height="300.0" rx="24" fill="#8B95A1" fill-opacity="0.08"/><text x="777.0" y="870.2" font-size="72" font-weight="900" fill="#191F28" text-anchor="middle" xml:space="preserve">약 200곳</text><text x="777.0" y="938.4" font-size="38" font-weight="500" fill="#191F28" fill-opacity="0.75" text-anchor="middle" xml:space="preserve">선정 규모</text></svg>
